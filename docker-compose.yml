# รันทุก service ของ Trading Card Gacha Platform จาก root ของ repo
#   cp .env.example .env            # แล้วแก้ค่า secret
#   docker compose up --build       # user-service :3001 + card-catalog-service :3003 + collection-service :3005
#   docker compose --profile full up  # รวม service ของเพื่อน (เมื่อมี image บน GHCR แล้ว)
# hostname ใน network นี้ = ชื่อ service (เช่น http://user-service:3001) ดู SERVICE_CONVENTIONS.md

x-shared-auth: &shared-auth
  JWT_SECRET: ${JWT_SECRET:?กรุณาตั้ง JWT_SECRET ในไฟล์ .env (อย่างน้อย 32 ตัวอักษร)}
  JWT_ISSUER: ${JWT_ISSUER:-user-service}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}

x-internal-auth: &internal-auth
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?กรุณาตั้ง INTERNAL_API_KEY ในไฟล์ .env (อย่างน้อย 32 ตัวอักษร)}
  ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}

services:
  user-service:
    build: ./user-service
    environment:
      <<: *shared-auth
      NODE_ENV: production
      PORT: 3001
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      PERSIST_DATA: ${PERSIST_DATA:-true}
    volumes:
      - user-data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

  card-catalog-service:
    build: ./card-catalog-service
    environment:
      <<: [*shared-auth, *internal-auth]
      NODE_ENV: production
      PORT: 3003
      PERSIST_DATA: ${PERSIST_DATA:-true}
    volumes:
      - catalog-data:/app/data
    ports:
      - "3003:3003"
    restart: unless-stopped

  collection-service:
    build: ./collection-service
    environment:
      <<: [*shared-auth, *internal-auth]
      NODE_ENV: production
      PORT: 3005
      USER_SERVICE_URL: http://user-service:3001
      # ว่าง = ไม่ถาม Catalog (เชื่อข้อมูลการ์ดที่ Gacha ส่งมา)
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL-http://card-catalog-service:3003}
      # เปิด Wallet เมื่อ wallet-service พร้อม (ใช้คู่กับ --profile full)
      WALLET_ENABLED: ${WALLET_ENABLED:-false}
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-}
      PERSIST_DATA: ${PERSIST_DATA:-true}
    volumes:
      - collection-data:/app/data
    ports:
      - "3005:3005"
    depends_on:
      user-service:
        condition: service_healthy
      card-catalog-service:
        condition: service_healthy
    restart: unless-stopped

  # ---- service ของเพื่อนในทีม: ยังไม่เสร็จ จึงอยู่ใน profile "full" ----
  # image / port เป็นค่าเสนอ ให้เจ้าของแต่ละ service ยืนยัน (ดู SERVICE_CONVENTIONS.md)
  wallet-service:
    profiles: ["full"]
    image: ${WALLET_IMAGE:-ghcr.io/tmno-o/deploy-and-testing-final-project/wallet-service:latest}
    environment:
      <<: [*shared-auth, *internal-auth]
      PORT: 3002
    ports:
      - "3002:3002"

  gacha-service:
    profiles: ["full"]
    image: ${GACHA_IMAGE:-ghcr.io/tmno-o/deploy-and-testing-final-project/gacha-service:latest}
    environment:
      <<: [*shared-auth, *internal-auth]
      PORT: 3004
      CATALOG_SERVICE_URL: http://card-catalog-service:3003
      COLLECTION_SERVICE_URL: http://collection-service:3005
    ports:
      - "3004:3004"

volumes:
  user-data:
  catalog-data:
  collection-data:
