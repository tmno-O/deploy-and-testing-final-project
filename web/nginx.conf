# หน้าเว็บ + reverse proxy: เบราว์เซอร์เรียกแค่โดเมนเดียว (/api/<service>/...) nginx ส่งต่อให้ service ใน network ของ compose
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64k;

  # ให้ service เห็น IP จริงของผู้ใช้ (ใช้คู่กับ TRUST_PROXY ใน docker-compose.yml)
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;

  # resolver + ตัวแปร: nginx เริ่มได้แม้ service บางตัวยังไม่ขึ้น และหา IP ใหม่เมื่อ container ถูกสร้างใหม่
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $user_svc       http://user-service:3001;
  set $wallet_svc     http://wallet-service:3002;
  set $catalog_svc    http://card-catalog-service:3003;
  set $collection_svc http://collection-service:3005;

  location /api/user/       { rewrite ^/api/user/(.*)$ /$1 break;       proxy_pass $user_svc; }
  location /api/wallet/     { rewrite ^/api/wallet/(.*)$ /$1 break;     proxy_pass $wallet_svc; }
  location /api/catalog/    { rewrite ^/api/catalog/(.*)$ /$1 break;    proxy_pass $catalog_svc; }
  location /api/collection/ { rewrite ^/api/collection/(.*)$ /$1 break; proxy_pass $collection_svc; }

  # route ภายในระบบ (/internal/*) ใช้ได้เฉพาะระหว่าง service เท่านั้น ห้ามเรียกผ่านเว็บ
  location ~ ^/api/[a-z]+/internal(/|$) { return 404; }

  location / { try_files $uri $uri/ /index.html; }
}
