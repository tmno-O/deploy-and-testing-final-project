# Release a single service: push a tag named <service>-vX.Y.Z (e.g. card-catalog-service-v1.2.0).
# Runs that service's checks, builds its Docker image and pushes it to GitHub Container Registry as :X.Y.Z, :X.Y and
# :latest (and to Docker Hub too when the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets exist), then creates a GitHub Release.
name: Release service

on:
  push:
    tags:
      - 'user-service-v*.*.*'
      - 'wallet-service-v*.*.*'
      - 'card-catalog-service-v*.*.*'
      - 'gacha-service-v*.*.*'
      - 'collection-service-v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Test, build & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      INTERNAL_API_KEY: ci-only-internal-ci-only-internal-1234
    steps:
      - uses: actions/checkout@v4

      - name: Read service and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^(user|wallet|card-catalog|gacha|collection)-service-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like <service>-vX.Y.Z"; exit 1
          fi
          echo "service=${BASH_REMATCH[1]}-service" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${BASH_REMATCH[1]}-service" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.tag.outputs.service }}/package-lock.json
      - name: Install, lint and test ${{ steps.tag.outputs.service }}
        working-directory: ${{ steps.tag.outputs.service }}
        run: |
          npm ci
          npm run lint
          if npm run | grep -q ' typecheck'; then npm run typecheck; fi
          npm test

      - name: Check Docker Hub credentials
        id: hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "enabled=$([ -n "$HUB_USER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.hub.outputs.enabled == 'true' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, steps.tag.outputs.service) || '' }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.tag.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.tag.outputs.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.service }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.service }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.tag.outputs.image }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Docker image: \`$IMAGE:$VERSION\`"
