# Moved from card-catalog-service/.github/workflows/ci.yml: GitHub only runs workflows in the root .github/workflows
name: card-catalog-service CI/CD

on:
  push:
    branches: [main]
    paths: ['card-catalog-service/**', '.github/workflows/card-catalog-service-ci.yml']
  pull_request:
    paths: ['card-catalog-service/**', '.github/workflows/card-catalog-service-ci.yml']

defaults:
  run:
    working-directory: card-catalog-service

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # real PostgreSQL so the row-locking / concurrency tests in tests/integration/postgres.test.ts run in CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/catalog_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      INTERNAL_API_KEY: ci-only-internal-ci-only-internal-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: card-catalog-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-catalog-service-coverage
          path: card-catalog-service/coverage/

  docker:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR image names must be lowercase (the repo owner has uppercase letters)
      - run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/card-catalog-service" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # PR: build only to verify the Dockerfile / push: build and push to GHCR
      - uses: docker/build-push-action@v6
        with:
          context: card-catalog-service
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=card-catalog-service
          cache-to: type=gha,mode=max,scope=card-catalog-service
