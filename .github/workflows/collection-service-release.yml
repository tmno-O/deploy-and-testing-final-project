# Release แบบ semver: git tag collection-service-v1.2.0 && git push origin collection-service-v1.2.0
# → image ghcr.io/<owner>/<repo>/collection-service:1.2.0, :1.2, :latest + GitHub Release
# prefix ชื่อ service ทำให้แต่ละคน release ของตัวเองได้อิสระใน repo เดียว
name: collection-service Release

on:
  push:
    tags: ['collection-service-v*']

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collection-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  release:
    name: Push image & create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # ชื่อ image บน GHCR ต้องเป็นตัวพิมพ์เล็ก (ชื่อ owner ของ repo มีตัวพิมพ์ใหญ่)
      - run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/collection-service" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=match,pattern=collection-service-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=collection-service-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: collection-service
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: softprops/action-gh-release@v2
        with:
          name: collection-service ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Docker image:
            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```
