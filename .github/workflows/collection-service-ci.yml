name: collection-service CI/CD

on:
  push:
    branches: [main]
    paths: ['collection-service/**', '.github/workflows/collection-service-ci.yml']
  pull_request:
    paths: ['collection-service/**', '.github/workflows/collection-service-ci.yml']

defaults:
  run:
    working-directory: collection-service

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collection-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      # coverageThreshold 80% ใน package.json → ต่ำกว่านั้น job นี้แดง
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-service-coverage
          path: collection-service/coverage/

  docker:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # ชื่อ image บน GHCR ต้องเป็นตัวพิมพ์เล็ก (ชื่อ owner ของ repo มีตัวพิมพ์ใหญ่)
      - run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/collection-service" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # PR: build อย่างเดียวเพื่อเช็คว่า Dockerfile ใช้ได้ / push เข้า main: build แล้ว push ขึ้น GHCR
      - uses: docker/build-push-action@v6
        with:
          context: collection-service
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=collection-service
          cache-to: type=gha,mode=max,scope=collection-service
