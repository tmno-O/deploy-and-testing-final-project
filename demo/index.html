      <label class="switch" style="margin-bottom:14px"><input type="checkbox" name="active" ${p.active ? 'checked' : ''}> เปิดขาย</label>
      <div class="form-error"></div>
      <button class="btn block">${pack ? 'บันทึกการแก้ไข' : 'สร้างแพ็ก'}</button>
    </form>`);
  const f = $('#packForm', m);
  const sumRates = () => RARITIES.reduce((s, r) => s + (Number(f['rate-' + r].value) || 0), 0);
  const showSum = () => { const n = sumRates(); const el = $('#rateSum', m); el.textContent = `รวม ${n}%${n === 100 ? ' ✓' : ' (ต้องเท่ากับ 100)'}`; el.className = 'rate-sum ' + (n === 100 ? 'good' : 'bad'); };
  f.oninput = () => { showSum(); $('.form-error', f).textContent = ''; }; showSum();
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = $('button', f), err = $('.form-error', f);
    err.textContent = '';
    if (sumRates() !== 100) { err.textContent = 'โอกาสทั้ง 4 ระดับต้องรวมกันได้ 100%'; return; }
    const v = (k) => f[k].value.trim();
    const body = {
      name: v('name'), description: v('description'), priceCredits: Number(v('priceCredits')), cardsPerPack: Number(v('cardsPerPack')),
      setIds: listParse(v('setIds')), rates: Object.fromEntries(RARITIES.map((r) => [r, Number(f['rate-' + r].value) || 0])), active: f.active.checked,
    };
    if (!pack) body.id = v('id');
    btn.disabled = true;
    try {
      if (pack) await api('catalog', `/admin/packs/${encodeURIComponent(pack.id)}`, { method: 'PATCH', auth: true, body });
      else await api('catalog', '/admin/packs', { method: 'POST', auth: true, body });
      closeModal(); toast(pack ? 'บันทึกแพ็กแล้ว' : 'สร้างแพ็กแล้ว'); loadAdminPacks();
    } catch (e) {
      err.textContent = e.code === 'PACK_EXISTS' ? 'มีแพ็กรหัสนี้อยู่แล้ว' : e.code === 'INVALID_RATES' ? 'โอกาสทั้ง 4 ระดับต้องรวมกันได้ 100%' : e.message;
      btn.disabled = false;
    }
  };
}

// ============================================================
//  ร้านค้า (กระเป๋าเครดิต)
// ============================================================
const OFFERS = [100, 300, 500, 1000];
let topupInfo = null;
function pageWallet() {
  if (!requireLogin()) return;
  $('#view').innerHTML = `
    <div class="page-title"><h1>ร้านค้า</h1></div>
    <div class="balance"><span class="coin"></span><div><span style="opacity:.85">เครดิตคงเหลือ</span><b id="walletBal">${state.balance === null ? '—' : fmt(state.balance)}</b><span class="small" style="opacity:.8">1 เครดิต = 1 บาท</span></div></div>
    <div class="section">
      <div class="section-head"><h2>เติมเครดิต</h2></div>
      <div id="topupBox"><div class="skel" style="height:150px"></div></div>
    </div>
    <div class="section panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
        <h3 style="margin:0">ประวัติรายการ</h3>
        <div class="seg" id="txFilter">${['', 'topup', 'purchase', 'charge', 'refund'].map((t) => `<button class="${state.txType === t ? 'on' : ''}" data-t="${t}">${t ? TX_TH[t] : 'ทั้งหมด'}</button>`).join('')}</div>
      </div>
      <div id="txList"><div class="skel" style="height:160px;margin-top:10px"></div></div>
    </div>`;
  $('#txFilter').onclick = (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    state.txType = b.dataset.t; state.txPage = 1;
    $$('button', $('#txFilter')).forEach((x) => x.classList.toggle('on', x === b));
    loadTx();
  };
  api('wallet', '/wallets/me', { auth: true }).then((w) => showBalance(w.balance)).catch((e) => { showBalance(null); toast(e.message, 'err'); });
  loadTx();
  (topupInfo ? Promise.resolve(topupInfo) : api('wallet', '/wallets/topup-methods'))
    .then((t) => { topupInfo = t; if ($('#topupBox')) renderTopup(); })
    .catch((e) => { if ($('#topupBox')) $('#topupBox').innerHTML = `<div class="notice">${esc(e.message)}</div>`; });
}

function renderTopup() {
  const t = topupInfo;
  const coins = (v) => '<span class="coin"></span>'.repeat(v >= 1000 ? 4 : v >= 500 ? 3 : v >= 300 ? 2 : 1);
  $('#topupBox').innerHTML = `
    <div class="shop">${OFFERS.map((v) => `<div class="offer ${state.topup === v ? 'on' : ''}" data-v="${v}">${v === 1000 ? '<span class="badge-best">ยอดนิยม</span>' : ''}<div class="stack">${coins(v)}</div><b>${fmt(v)}</b><span class="muted small">เครดิต</span></div>`).join('')}</div>
    <div class="panel" style="margin-top:14px">
      <div class="field" style="margin-bottom:12px"><label>หรือระบุจำนวนเอง</label><input class="input" id="topupAmt" type="number" min="${t.minAmount}" max="${t.maxAmount}" step="1" value="${state.topup}"></div>
      ${t.provider === 'mock' ? '<div class="notice info small">ระบบทดลอง: เติมเครดิตได้ฟรี ไม่มีการตัดเงินจริง</div>' : ''}
      <button class="btn gold block" id="topupBtn">เติม ${fmt(state.topup)} เครดิต</button>
      <div class="small muted" style="margin-top:10px;text-align:center">ขั้นต่ำ ${fmt(t.minAmount)} สูงสุด ${fmt(t.maxAmount)} เครดิตต่อครั้ง</div>
    </div>`;
  $('.shop').onclick = (ev) => { const b = ev.target.closest('.offer'); if (b) { state.topup = +b.dataset.v; renderTopup(); } };
  $('#topupAmt').oninput = (ev) => {
    state.topup = Math.floor(+ev.target.value) || 0;
    $$('.offer').forEach((p) => p.classList.toggle('on', +p.dataset.v === state.topup));
    $('#topupBtn').textContent = `เติม ${fmt(state.topup)} เครดิต`;
  };
  $('#topupBtn').onclick = async () => {
    const amount = state.topup;
    if (!(amount >= t.minAmount && amount <= t.maxAmount)) return toast(`จำนวนต้องอยู่ระหว่าง ${fmt(t.minAmount)} ถึง ${fmt(t.maxAmount)}`, 'err');
    const btn = $('#topupBtn'); btn.disabled = true; btn.textContent = 'กำลังเติมเครดิต…';
    try {
      const res = await api('wallet', '/wallets/me/topups', { method: 'POST', auth: true, headers: { 'Idempotency-Key': 'topup-' + uuid() }, body: { amount, method: t.methods[0] } });
      showBalance(res.balance);
      toast(`เติม ${fmt(amount)} เครดิตสำเร็จ`);
      state.txPage = 1; loadTx();
    } catch (e) { toast(e.message, 'err'); }
    if (btn.isConnected) { btn.disabled = false; btn.textContent = `เติม ${fmt(state.topup)} เครดิต`; }
  };
}

async function loadTx() {
  const qs = new URLSearchParams({ page: state.txPage, limit: 10 });
  if (state.txType) qs.set('type', state.txType);
  try {
    const res = await api('wallet', `/wallets/me/transactions?${qs}`, { auth: true });
    const el = $('#txList'); if (!el) return;
    if (!res.data.length) { el.innerHTML = `<div class="muted" style="padding:28px 0;text-align:center">ยังไม่มีรายการ</div>`; return; }
    const tp = Math.max(1, res.totalPages);
    el.innerHTML = res.data.map((t) => `<div class="tx">
        <div class="ic ${t.direction}">${TX_ICON[t.type] || '•'}</div>
        <div class="mid"><b>${TX_TH[t.type] || esc(t.type)}</b><div>${dateTime(t.createdAt)}${t.reason ? ' · ' + esc(t.reason) : ''}</div></div>
        <div class="amt ${t.direction === 'credit' ? 'plus' : 'minus'}">${t.direction === 'credit' ? '+' : '−'}${fmt(t.amount)}<div>คงเหลือ ${fmt(t.balanceAfter)}</div></div>
      </div>`).join('') +
      (tp > 1 ? `<div class="pager"><button class="btn white sm" data-p="${state.txPage - 1}" ${state.txPage <= 1 ? 'disabled' : ''}>‹</button><span class="muted small">หน้า ${state.txPage} / ${tp}</span><button class="btn white sm" data-p="${state.txPage + 1}" ${state.txPage >= tp ? 'disabled' : ''}>›</button></div>` : '');
    el.onclick = (ev) => { const b = ev.target.closest('[data-p]'); if (b && !b.disabled) { state.txPage = +b.dataset.p; loadTx(); } };
  } catch (e) { if ($('#txList')) $('#txList').innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}

// ============================================================
//  โปรไฟล์
// ============================================================
function pageAccount() {
  if (!requireLogin()) return;
  const u = state.user;
  $('#view').innerHTML = `
    <div class="panel" style="display:flex;align-items:center;gap:16px;margin-top:10px">
      <div class="avatar" style="width:66px;height:66px;font-size:26px;cursor:default">${esc(initials(u))}</div>
      <div><h1 style="margin:0;font-size:24px">${esc(u.displayName)}</h1><div class="muted small">${esc(u.email)}</div></div>
    </div>
    <div class="split section">
      <div class="panel">
        <h3>ข้อมูลส่วนตัว</h3>
        <form id="profileForm" novalidate>
          <div class="grid2">
            <div class="field"><label>ชื่อ</label><input class="input" name="firstName" value="${esc(u.firstName)}"></div>
            <div class="field"><label>นามสกุล</label><input class="input" name="lastName" value="${esc(u.lastName)}"></div>
          </div>
          <div class="field"><label>ชื่อผู้เล่น</label><input class="input" name="displayName" value="${esc(u.displayName)}"></div>
          <div class="field"><label>อีเมล</label><input class="input" name="email" type="email" value="${esc(u.email)}"></div>
          <div class="form-error"></div>
          <button class="btn">บันทึกข้อมูล</button>
        </form>
        <h3 style="margin-top:28px">เปลี่ยนรหัสผ่าน</h3>
        <form id="pwForm" novalidate>
          <div class="field"><label>รหัสผ่านปัจจุบัน</label><input class="input" name="currentPassword" type="password" autocomplete="current-password"></div>
          <div class="field"><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</label><input class="input" name="newPassword" type="password" autocomplete="new-password"></div>
          <div class="form-error"></div>
          <button class="btn white">เปลี่ยนรหัสผ่าน</button>
        </form>
      </div>
      <div class="panel ${isAdmin() ? 'hidden' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">ที่อยู่จัดส่ง</h3><button class="btn white sm" id="newAddr">+ เพิ่ม</button></div>
        <div id="addrBook"><div class="skel" style="height:120px"></div></div>
      </div>
    </div>`;

  $('#profileForm').onsubmit = async (ev) => {
    ev.preventDefault();
    const f = ev.target, btn = $('button', f), err = $('.form-error', f);
    err.textContent = ''; btn.disabled = true;
    try {
      const { user } = await api('user', '/users/me', { method: 'PATCH', auth: true, body: Object.fromEntries(new FormData(f)) });
      state.user = user; session.set('cd-session', { token: state.token, user });
      renderNav(); showBalance(state.balance);
      toast('บันทึกข้อมูลแล้ว');
      pageAccount();
      return;
    } catch (e) { err.textContent = e.message; }
    if (btn.isConnected) btn.disabled = false;
  };
  $('#pwForm').onsubmit = async (ev) => {
    ev.preventDefault();
    const f = ev.target, btn = $('button', f), err = $('.form-error', f);
    err.textContent = ''; btn.disabled = true;
    try {
      await api('user', '/users/me/password', { method: 'PUT', auth: true, body: Object.fromEntries(new FormData(f)) });
      f.reset(); toast('เปลี่ยนรหัสผ่านแล้ว');
    } catch (e) { err.textContent = e.code === 'INVALID_CREDENTIALS' ? 'รหัสผ่านปัจจุบันไม่ถูกต้อง' : e.message; }
    if (btn.isConnected) btn.disabled = false;
  };
  $('#newAddr').onclick = () => openAddressForm(null, loadAddressBook);
  loadAddressBook();
}

async function loadAddressBook() {
  try {
    const { addresses } = await api('user', '/users/me/addresses', { auth: true });
    addressCache = addresses;
    const el = $('#addrBook'); if (!el) return;
    el.innerHTML = addresses.length ? addresses.map((a) => `
      <div class="addr" style="cursor:default;display:block">
        <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(a.recipientName)} ${a.isDefault ? '<span class="tag">ที่อยู่หลัก</span>' : ''}</b><span class="muted small">${esc(a.phone)}</span></div>
        <div class="muted small" style="margin:4px 0 10px">${esc(formatAddress(a))}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn white sm" data-edit="${a.id}">แก้ไข</button>
          ${a.isDefault ? '' : `<button class="btn white sm" data-default="${a.id}">ตั้งเป็นหลัก</button><button class="btn danger sm" data-del="${a.id}">ลบ</button>`}
        </div>
      </div>`).join('') : empty('🏠', 'ยังไม่มีที่อยู่', 'เพิ่มที่อยู่เพื่อใช้สั่งจัดส่งการ์ด');
    el.onclick = async (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      try {
        if (b.dataset.edit) return openAddressForm(addresses.find((a) => a.id === b.dataset.edit), loadAddressBook);
        if (b.dataset.default) { await api('user', `/users/me/addresses/${b.dataset.default}`, { method: 'PATCH', auth: true, body: { isDefault: true } }); toast('ตั้งเป็นที่อยู่หลักแล้ว'); }
        if (b.dataset.del) { if (!confirm('ลบที่อยู่นี้?')) return; await api('user', `/users/me/addresses/${b.dataset.del}`, { method: 'DELETE', auth: true }); toast('ลบที่อยู่แล้ว'); }
        loadAddressBook();
      } catch (e) { toast(e.message, 'err'); }
    };
  } catch (e) { if ($('#addrBook')) $('#addrBook').innerHTML = `<div class="notice">${esc(e.message)}</div>`; }
}


// ============================================================
//  เริ่มต้น
// ============================================================
const saved = session.get('cd-session');
if (saved && saved.token && saved.user) { state.token = saved.token; state.user = saved.user; }
renderNav();
loadBalance();
checkAdmin();
route();
</script>
</body>
</html>
