openapi: 3.0.3
info:
  title: Collection & Fulfillment Service
  version: 1.0.0
  description: |
    Service 5 of the Online Trading Card Gacha Platform: digital card collections and physical card delivery.
    Conventions follow card-catalog-service: `X-Internal-Key` for service calls, admin = JWT whose `sub` is in
    ADMIN_USER_IDS, page/limit pagination and `{ error: { code, message, details? } }` errors.
    Every response carries `X-Request-Id` (sent by the caller if valid, otherwise generated).
servers:
  - url: http://localhost:3005
tags:
  - name: health
  - name: collection
  - name: internal
  - name: fulfillment
  - name: admin

components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from user-service (HS256, iss=user-service, sub=userId)
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Same JWT; its `sub` must be listed in ADMIN_USER_IDS (403 FORBIDDEN otherwise)
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Shared INTERNAL_API_KEY for service-to-service calls

  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    rarity:
      name: rarity
      in: query
      schema: { $ref: '#/components/schemas/Rarity' }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    orderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Rarity:
      type: string
      enum: [common, rare, epic, legendary]
    OrderStatus:
      type: string
      enum: [PENDING, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: {}
    Card:
      type: object
      additionalProperties: false
      required: [cardId, cardName, cardRarity, cardImageUrl, quantity, redeemedQuantity, availableQuantity, createdAt, updatedAt]
      properties:
        cardId: { type: string, pattern: '^[A-Za-z0-9._-]{1,40}$', example: base1-1 }
        cardName: { type: string }
        cardRarity: { $ref: '#/components/schemas/Rarity' }
        cardImageUrl: { type: string, format: uri }
        quantity: { type: integer, minimum: 0 }
        redeemedQuantity: { type: integer, minimum: 0, description: cards held by orders that are not cancelled }
        availableQuantity: { type: integer, minimum: 0, description: quantity - redeemedQuantity }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CardPage:
      type: object
      additionalProperties: false
      required: [data, page, limit, total, totalPages]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Card' } }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    AddCardRequest:
      type: object
      additionalProperties: false
      required: [pullId, cardId]
      properties:
        pullId: { type: string, format: uuid, description: idempotency key of that Gacha pull }
        cardId: { type: string, pattern: '^[A-Za-z0-9._-]{1,40}$', example: base1-1 }
        cardName: { type: string, description: required while the catalog is disabled }
        cardRarity: { $ref: '#/components/schemas/Rarity' }
        cardImageUrl: { type: string, format: uri, description: required while the catalog is disabled }
        quantity: { type: integer, minimum: 1, maximum: 100, default: 1 }
    AddCardResponse:
      type: object
      additionalProperties: false
      required: [pullId, created, card]
      properties:
        pullId: { type: string, format: uuid }
        created: { type: boolean, description: 'false = this pullId was already applied and nothing was added' }
        card: { $ref: '#/components/schemas/Card' }
    ShippingAddress:
      type: object
      additionalProperties: false
      required: [recipientName, phone, line1, district, province, postalCode]
      properties:
        recipientName: { type: string, maxLength: 100 }
        phone: { type: string, pattern: '^[0-9+\-\s]{8,20}$' }
        line1: { type: string, maxLength: 255 }
        line2: { type: string, maxLength: 255 }
        subdistrict: { type: string, maxLength: 100 }
        district: { type: string, maxLength: 100 }
        province: { type: string, maxLength: 100 }
        postalCode: { type: string, pattern: '^\d{5}$' }
    OrderItemRequest:
      type: object
      additionalProperties: false
      required: [cardId, quantity]
      properties:
        cardId: { type: string, pattern: '^[A-Za-z0-9._-]{1,40}$' }
        quantity: { type: integer, minimum: 1 }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      description: exactly one of addressId or shippingAddress
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemRequest' }
        addressId: { type: string, format: uuid, description: address id in user-service }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
    Order:
      type: object
      additionalProperties: false
      required: [id, userId, items, addressId, shippingAddress, shippingFee, status, trackingNumber, paymentStatus, paymentRef, statusHistory, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cardId, cardName, quantity]
            properties:
              cardId: { type: string, pattern: '^[A-Za-z0-9._-]{1,40}$' }
              cardName: { type: string }
              quantity: { type: integer }
        addressId: { type: string, format: uuid, nullable: true }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        shippingFee: { type: integer, description: whole baht }
        status: { $ref: '#/components/schemas/OrderStatus' }
        trackingNumber: { type: string, nullable: true }
        paymentStatus: { type: string, enum: [NOT_REQUIRED, PAID, REFUNDED] }
        paymentRef: { type: string, nullable: true }
        statusHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [status, at]
            properties:
              status: { $ref: '#/components/schemas/OrderStatus' }
              at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderPage:
      type: object
      additionalProperties: false
      required: [data, page, limit, total, totalPages]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    UpdateStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        trackingNumber: { type: string, description: required when status is SHIPPED }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string, enum: [ok] } }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness (store loaded)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string, enum: [ready] } }
        '503': { $ref: '#/components/responses/Error' }

  /collections/me:
    get:
      tags: [collection]
      summary: My cards
      security: [{ userJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/rarity'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /collections/me/{cardId}:
    get:
      tags: [collection]
      summary: One of my cards
      security: [{ userJwt: [] }]
      parameters:
        - name: cardId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /internal/collections/{userId}/cards:
    post:
      tags: [internal]
      summary: (Gacha) add a pulled card, idempotent by pullId
      security: [{ internalKey: [] }]
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCardRequest' }
      responses:
        '200':
          description: pullId already applied; the first result is returned, nothing is added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddCardResponse' }
        '201':
          description: Card added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddCardResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: PULL_ID_CONFLICT (same pullId for another user or card)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: CARD_NOT_FOUND (catalog enabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: CATALOG_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /internal/collections/{userId}:
    get:
      tags: [internal]
      summary: Any user's collection
      security: [{ internalKey: [] }]
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/rarity'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /fulfillments/orders:
    post:
      tags: [fulfillment]
      summary: Request physical delivery (all-or-nothing)
      security: [{ userJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402':
          description: INSUFFICIENT_BALANCE (wallet enabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: INSUFFICIENT_QUANTITY (details lists the short cards)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: ADDRESS_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: USER_SERVICE_UNAVAILABLE / WALLET_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [fulfillment]
      summary: My orders (newest first)
      security: [{ userJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /fulfillments/orders/{id}:
    get:
      tags: [fulfillment]
      summary: One order (someone else's answers 404)
      security: [{ userJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /fulfillments/orders/{id}/cancel:
    post:
      tags: [fulfillment]
      summary: Cancel a PENDING order; returns the cards and refunds a paid fee
      security: [{ userJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: INVALID_STATUS_TRANSITION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: WALLET_SERVICE_UNAVAILABLE (refund failed, order unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/fulfillments/orders/{id}/status:
    patch:
      tags: [admin]
      summary: Change order status (state machine)
      description: |
        PENDING → PROCESSING → SHIPPED → DELIVERED, PENDING/PROCESSING → CANCELLED
        SHIPPED needs a trackingNumber. A user may only cancel while PENDING.
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStatusRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: INVALID_STATUS_TRANSITION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
