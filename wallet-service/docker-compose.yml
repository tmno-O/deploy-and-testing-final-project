# Run wallet-service standalone (data lives in a JSON file, no database needed)
# Usage: cp .env.example .env && docker compose up --build
# Pack purchases need card-catalog-service: use the docker-compose.yml at the repo root for that
services:
  wallet-service:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_ISSUER: ${JWT_ISSUER:-user-service}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (at least 32 characters)}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PERSIST_DATA: ${PERSIST_DATA:-true}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL-http://host.docker.internal:3003}
      CATALOG_SERVICE_TIMEOUT_MS: ${CATALOG_SERVICE_TIMEOUT_MS:-3000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      TOPUP_MIN_AMOUNT: ${TOPUP_MIN_AMOUNT:-1}
      TOPUP_MAX_AMOUNT: ${TOPUP_MAX_AMOUNT:-100000}
      MAX_BALANCE: ${MAX_BALANCE:-10000000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # a new volume is seeded from the image's (empty) data file on first run; `docker compose down -v` resets it
      - wallet-data:/app/data
    ports:
      - "3002:3002"
    restart: unless-stopped

volumes:
  wallet-data:
